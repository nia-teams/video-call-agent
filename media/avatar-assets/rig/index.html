<script src="lib/pixi.min.js"></script>

<script>
(async()=>{
const W=1024, VIEW_H=1180;
// OBS CEF commonly reports DPR=1 even for a 1080x1920 source. Render at 2x
// before CSS fitting so the final portrait is downsampled instead of upscaled.
const renderResolution=/[?&]studio=1/.test(location.search)?2:Math.min(devicePixelRatio,2);
const app=new PIXI.Application({width:W,height:VIEW_H,backgroundAlpha:0,antialias:true,resolution:renderResolution,autoDensity:false});
document.getElementById('stage').appendChild(app.view);
const meta=await (await fetch('assets/layers.json')).json();
const names=['back_hair','handwear_l','handwear_r','neck','topwear','collar_front','ears_r','ears_l','face','front_hair','nose','hair_out_l','hair_out_r','hair_in_l','hair_in_r','hair_bang_l','hair_bang_r','bh_long','bh_cap','bh_side_l','bh_side_r',
 'eyewhite_r','eyewhite_l','eyeiris_r','eyeiris_l','eyelash_r','eyelash_l','eyebrow_l','eyebrow_r','eyeclosed_r','eyeclosed_l','eyelid_r','eyelid_l',
 'mouth_up','mouth_lo','eyelid_clean_r','eyelid_clean_l','eyelash_up_r','eyelash_up_l','laugheye_r','laugheye_l','sleepeye_r','sleepeye_l','mouth_inup','mouth_inlo'];
const tex={};
await Promise.all(names.map(async n=>{tex[n]=await PIXI.Assets.load('assets/'+n+'.png')}));
const box=n=>n.startsWith('eyewhite')||n.startsWith('eyeiris')?meta['eye_'+n.slice(-1)]:meta[n];
function spr(n){const s=new PIXI.Sprite(tex[n]);const b=box(n);s.position.set(b.x,b.y);return s}
function plane(t,b,c,r){const m=new PIXI.SimplePlane(t,c,r);m.position.set(b.x,b.y);const buf=m.geometry.getBuffer('aVertexPosition');m._buf=buf;m._o=Float32Array.from(buf.data);m._b=b;return m}
function mesh(n,c,r,rootY,len){const m=plane(tex[n],meta[n],c,r);m._rootY=rootY;m._len=len;return m}
// ===== Bezier lattice warp deformers =====
// Each part gets its own coarse Bezier lattice (cols x rows control points).
// Keyforms are stored only at Angle X = -1/0/+1 and Angle Y = -1/0/+1; the pose is a linear blend.
// Inside a part the mapping is a smooth low-order Bezier, so the art itself is never rippled.
const FAC=[1,1,2,6,24];const bern=(n,i,t)=>{const c=FAC[n]/(FAC[i]*FAC[n-i]);return c*Math.pow(t,i)*Math.pow(1-t,n-i)};
function warp(pl,cols,rows){const o=pl._o,b=pl._b,W=[];
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;for(let i=0;i<o.length;i+=2){mnx=Math.min(mnx,o[i]);mxx=Math.max(mxx,o[i]);mny=Math.min(mny,o[i+1]);mxy=Math.max(mxy,o[i+1])}
  for(let i=0;i<o.length;i+=2){const u=(o[i]-mnx)/(mxx-mnx),v=(o[i+1]-mny)/(mxy-mny),w=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)w.push(bern(cols-1,c,u)*bern(rows-1,r,v));W.push(w)}
  pl._W=W;pl._cols=cols;pl._rows=rows;return pl}
function applyWarp(pl,off){const d=pl._buf.data,o=pl._o,W=pl._W;
  for(let k=0;k<W.length;k++){const w=W[k];let dx=0,dy=0;for(let j=0;j<w.length;j++){dx+=w[j]*off[j][0];dy+=w[j]*off[j][1]}
    d[2*k]=o[2*k]+dx;d[2*k+1]=o[2*k+1]+dy}
  pl._buf.update()}
// keyform tables: grid[row][col] = [dx,dy] at the extreme of that parameter
const G=(rows)=>rows.flat();
const mirror=(k,cols)=>{const r=[];for(let j=0;j<k.length/cols;j++)for(let i=0;i<cols;i++){const q=k[j*cols+(cols-1-i)];r.push([-q[0],q[1]])}return r};
function blend(kf,X,Y,extra){const n=kf.xp.length,r=[];
  for(let j=0;j<n;j++){const kx=X>=0?kf.xp[j]:kf.xn[j],ky=Y>=0?kf.yp[j]:kf.yn[j];
    r.push([Math.abs(X)*kx[0]+Math.abs(Y)*ky[0]+(extra?extra[j][0]:0),Math.abs(X)*kx[1]+Math.abs(Y)*ky[1]+(extra?extra[j][1]:0)])}
  return r}
// ---- Head parent warp ("face curve" deformer), 3x3 control points over the head box.
// Hand-authored keyframes: turn side compresses, centre column leads ("く" nose line),
// chin row moves least (stays on the neck). Values are pixel offsets at Angle X/Y = +1.
// Turn perspective: an approximate dome-shaped head volume gives
// each point a depth z; the Angle X keyform moves a point by z*sin(theta), Angle Y likewise vertically. So the nose /
// eye row (front) leads, the cheek contour moves less, the head outline / crown / ears (z ~ 0) stay put: the far half
// of the face compresses, the near half widens, and the face slides over the ears and the back hair.
// The keyform is baked into a 5x5 Bezier lattice (least-squares fit) — at runtime it is pure keyform interpolation.
const HB={x0:300,x1:720,y0:30,y1:570};
const HEAD3D={cx:510,cy:300,rx:210,ry:270,rz:190,tx:.22,ty:.1,shift:5};
const headZ=(x,y)=>{const u=(x-HEAD3D.cx)/HEAD3D.rx,v=(y-HEAD3D.cy)/HEAD3D.ry;return HEAD3D.rz*Math.max(0,1-u*u-v*v)};
function fitLattice(fn){ // least-squares 5x5 Bernstein control points for an offset field fn(x,y)->[dx,dy]
  const N=25,A=Array.from({length:N},()=>new Float64Array(N)),bx=new Float64Array(N),by=new Float64Array(N);
  for(let j=0;j<=36;j++)for(let i=0;i<=36;i++){const u=i/36,v=j/36,x=HB.x0+u*(HB.x1-HB.x0),y=HB.y0+v*(HB.y1-HB.y0),f=fn(x,y),w=[];
    for(let r=0;r<5;r++)for(let c=0;c<5;c++)w.push(bern(4,c,u)*bern(4,r,v));
    for(let a=0;a<N;a++){bx[a]+=w[a]*f[0];by[a]+=w[a]*f[1];for(let b=0;b<N;b++)A[a][b]+=w[a]*w[b]}}
  const solve=rhs=>{const M=A.map((r,i)=>[...r,rhs[i]]);for(let i=0;i<N;i++){let p=i;for(let k=i+1;k<N;k++)if(Math.abs(M[k][i])>Math.abs(M[p][i]))p=k;[M[i],M[p]]=[M[p],M[i]];
      for(let k=0;k<N;k++)if(k!==i){const f=M[k][i]/M[i][i];for(let c=i;c<=N;c++)M[k][c]-=f*M[i][c]}}return M.map((r,i)=>r[N]/r[i])};
  const X=solve(bx),Y=solve(by);return X.map((v,i)=>[v,Y[i]])}
const HEADKF={
  // x' = (x-cx)cos + z sin: the cos term (only on the face volume) narrows the far half, the z term makes the front lead
  xp:fitLattice((x,y)=>{const z=headZ(x,y),m=Math.min(1,2*z/HEAD3D.rz);return [(x-HEAD3D.cx)*(Math.cos(HEAD3D.tx)-1)*m+z*Math.sin(HEAD3D.tx)+HEAD3D.shift,0]}),
  // nod: same dome but evaluated with a flatter vertical profile, so the eye band moves as one piece (no vertical squash of the eyes)
  yp:fitLattice((x,y)=>{const u=(x-HEAD3D.cx)/HEAD3D.rx,v=(y-HEAD3D.cy)/(HEAD3D.ry*1.6);return [0,HEAD3D.rz*Math.max(0,1-u*u-v*v)*Math.sin(HEAD3D.ty)]})};
HEADKF.xn=HEADKF.xp.map(q=>[-q[0],q[1]]); HEADKF.yn=HEADKF.yp.map(q=>[q[0],-q[1]]);
// Front hair is a shell OUTSIDE the skull: bigger radius, so its turn keyform is flatter (less stretch across the near
// side). With the face's own field the near-side locks stretched apart and the skin between them showed as a pale line.
const HAIR3D={rx:300,ry:360,rz:200};
const hairZ=(x,y)=>{const u=(x-HEAD3D.cx)/HAIR3D.rx,v=(y-HEAD3D.cy)/HAIR3D.ry;return HAIR3D.rz*Math.max(0,1-u*u-v*v)};
const HAIRKF={
  xp:fitLattice((x,y)=>{const z=hairZ(x,y),m=Math.min(1,2*z/HAIR3D.rz);return [(x-HEAD3D.cx)*(Math.cos(HEAD3D.tx)-1)*m*.6+z*Math.sin(HEAD3D.tx)+HEAD3D.shift,0]}),
  yp:fitLattice((x,y)=>[0,hairZ(x,y)*Math.sin(HEAD3D.ty)])};
HAIRKF.xn=HAIRKF.xp.map(q=>[-q[0],q[1]]); HAIRKF.yn=HAIRKF.yp.map(q=>[q[0],-q[1]]);
let HOFF_H=null;
// Each part has an independent displacement field, blended at its attachment points.
// Parallax budgets are derived from this character's layer sizes in pixels.
const RIG={eyeY:meta.eyewhite_r.h*.25};
const RIGX={front:meta.front_hair.w*.05,back:-meta.back_hair.w*.003};
const ZERO25=Array.from({length:25},()=>[0,0]);
let HOFF=null, CROWN=()=>[0,0];
function headField(x,y,F){F=F||HOFF;const u=Math.max(0,Math.min(1,(x-HB.x0)/(HB.x1-HB.x0))),v=Math.max(0,Math.min(1,(y-HB.y0)/(HB.y1-HB.y0)));
  let dx=0,dy=0;for(let r=0;r<5;r++)for(let c=0;c<5;c++){const w=bern(4,c,u)*bern(4,r,v),q=F[r*5+c];dx+=w*q[0];dy+=w*q[1]}return [dx,dy]}
function headFollow(pl,k=1,extra,F){const d=pl._buf.data,o=pl._o,b=pl._b;
  for(let i=0;i<d.length;i+=2){const gx=b.x+o[i],gy=b.y+o[i+1],h=headField(gx,gy,F),e=extra?extra(gx,gy):[0,0];
    d[i]=o[i]+h[0]*k+e[0];d[i+1]=o[i+1]+h[1]*k+e[1]}
  pl._buf.update()}
// ---- Body parent lattice warp: 3 cols x 4 rows over the torso, waist row pinned.
// Keyforms for ParamBodyAngleX (turn), ParamBodyAngleY (lean forward = +, same sign as Angle Y look-down) and ParamBreath.
// The head is the child of this deformer: it rides on the neck point (top-centre of the lattice).
const BB={x0:0,x1:1024,y0:470,y1:1536};
const BODYKF={
  xp:G([[[18,-2],[40,0],[12,3]],     // shoulders: centre leads, far side compresses and drops a touch, like the head
        [[10,0],[24,0],[ 7,1]],
        [[ 3,0],[ 7,0],[ 2,0]],
        [[ 0,0],[ 0,0],[ 0,0]]]),
  yp:G([[[-7,12],[0,16],[7,12]],     // lean in: shoulders drop and come forward (slightly wider)
        [[-4,6],[0,8],[4,6]],
        [[0,1],[0,1],[0,1]],
        [[0,0],[0,0],[0,0]]])};
BODYKF.xn=mirror(BODYKF.xp,3); BODYKF.yn=BODYKF.yp.map(q=>[-q[0],-q[1]]);
const BREATHKF=G([[[-1.2,-3.2],[0,-2.6],[1.2,-3.2]],   // inhale: shoulders rise, chest widens a touch
                  [[-1.6,-1.6],[0,-1.2],[1.6,-1.6]],
                  [[-.4,-.4],[0,-.3],[.4,-.4]],
                  [[0,0],[0,0],[0,0]]]);
let BOFF=null;
function bodyField(x,y){const u=Math.max(0,Math.min(1,(x-BB.x0)/(BB.x1-BB.x0))),v=Math.max(0,Math.min(1,(y-BB.y0)/(BB.y1-BB.y0)));
  let dx=0,dy=0;for(let r=0;r<4;r++)for(let c=0;c<3;c++){const w=bern(2,c,u)*bern(3,r,v),q=BOFF[r*3+c];dx+=w*q[0];dy+=w*q[1]}return [dx,dy]}
function bodyFollow(pl){const d=pl._buf.data,o=pl._o,b=pl._b;
  for(let i=0;i<d.length;i+=2){const h=bodyField(b.x+o[i],b.y+o[i+1]);d[i]=o[i]+h[0];d[i+1]=o[i+1]+h[1]}pl._buf.update()}
const NECK={x:507,y:520}; // where the head deformer is pinned on the body
const interp=(xs,ys,x)=>{if(x<=xs[0])return ys[0];const n=xs.length-1;if(x>=xs[n])return ys[n];let i=0;while(xs[i+1]<x)i++;const t=(x-xs[i])/(xs[i+1]-xs[i]);return ys[i]+(ys[i+1]-ys[i])*t};
const RES=2; // render-textures at 2x: face is drawn to a texture and then warped; at 1x the double resampling smeared the dark lash edges into a brown wedge at the outer eye corners
// ---------- scene ----------
const stageRoot=new PIXI.Container();app.stage.addChild(stageRoot); stageRoot.y=-10;
if(/[?&]studio=1/.test(location.search)){
  const portraitScale=0.7225;
  stageRoot.scale.set(portraitScale);
  stageRoot.x=W*(1-portraitScale)/2;
  stageRoot.y=VIEW_H*(1-portraitScale)/2-10*portraitScale;
}
// ParamBodyAngleZ: the whole model (body + head as its child) leans around the waist, below the frame
const root=new PIXI.Container();root.pivot.set(512,1536);root.position.set(512,1536);stageRoot.addChild(root);
const PIV={x:507,y:500};
function headGroup(){const c=new PIXI.Container();c.pivot.set(PIV.x,PIV.y);c.position.set(PIV.x,PIV.y);return c}
const backHead=headGroup(); root.addChild(backHead);
const body=new PIXI.Container(); root.addChild(body);
const head=headGroup(); root.addChild(head);
const L={};
// back hair split: long back hair (heavy, slow, lower part carried by the body),
// back-of-head cap (moves with the head only), side curls by the ears (light, own chain). Drawn back to front.
L.bh_long=mesh('bh_long',24,30,330,760); backHead.addChild(L.bh_long);
L.bh_cap=mesh('bh_cap',12,12,0,1); backHead.addChild(L.bh_cap);
const BACKG=[['bh_side_l',250,420,.85,{k:44,c:3.6,g:120,lag:1.15}],['bh_side_r',250,420,.85,{k:47,c:3.7,g:115,lag:1.15}]];
for(const [n,ry,len] of BACKG){L[n]=mesh(n,10,22,ry,len);backHead.addChild(L[n])}
['handwear_l','handwear_r','topwear'].forEach(n=>{L[n]=plane(tex[n],meta[n],16,20);body.addChild(L[n])});
// neck: mesh whose top follows the head, bottom stays in collar; collar front drawn over it
L.neck=plane(tex.neck,meta.neck,6,10); body.addChild(L.neck);
L.collar=plane(tex.collar_front,meta.collar_front,6,24); body.addChild(L.collar);
// head
head.addChild(L.ears_r=plane(tex.ears_r,meta.ears_r,6,8)); head.addChild(L.ears_l=plane(tex.ears_l,meta.ears_l,6,8));
const FB={x:330,y:90,w:360,h:440};
const faceG=new PIXI.Container(); const fadd=o=>{faceG.addChild(o);return o};
L.face=fadd(spr('face'));
// ---- blush (ParamCheek): soft ellipses under the eyes, drawn on the skin below the eyes
const blush=fadd(new PIXI.Graphics());
blush.beginFill(0xff7a7a).drawEllipse(426,370,44,17).drawEllipse(592,370,44,17).endFill();
blush.filters=[new PIXI.BlurFilter(16,4)]; blush.alpha=0;
// ---- eyes. Layer structure: white + iris (clipped by the white) + lashes, all on the same lid deformation.
// The iris is NEVER squashed: it is only clipped by the deformed white, like a real eyeball under the lid.
const eyes={};
for(const s of ['r','l']){
  const B=meta['eyeclosed_'+s], E=meta._eyes[s], EB=meta['eye_'+s];
  const lid=fadd(spr('eyelid_'+s)); lid.alpha=0;
  const wpl=fadd(plane(tex['eyewhite_'+s],EB,8,14));
  const ir=fadd(spr('eyeiris_'+s));
  const maskRT=PIXI.RenderTexture.create({width:EB.w,height:EB.h,resolution:RES});
  const msk=fadd(new PIXI.Sprite(maskRT)); msk.position.set(EB.x,EB.y); ir.mask=msk;
  const lpl=fadd(plane(tex['eyelash_'+s],meta['eyelash_'+s],10,14));
  const cl=fadd(spr('eyeclosed_'+s)); cl.alpha=0;
  // smiling closed eye (EyeOpen 0 + EyeSmile 1), drawn by bending the eyelid:
  // skin covers the eye, and the UPPER lash line keeps its upward arch, squashed down onto the eye line -> "∩" (^^).
  // Lower lashes are dropped. (Bending the blink arc "∪" was wrong: the lid pointed down.)
  const cs=fadd(new PIXI.Container()); cs.alpha=0;
  // laugh eyes: painted by the image model as a whole (eyes + surrounding skin), swapped in as one part
  cs.addChild(spr('laugheye_'+s));
  // sleepy eyes: also painted by the image model as one part (half-lowered lids + surrounding skin)
  const ss=fadd(spr('sleepeye_'+s)); ss.alpha=0;

  const cx=(E.x[0]+E.x[E.x.length-1])/2, hw=(E.x[E.x.length-1]-E.x[0])/2;
  eyes[s]={ir,ix:ir.x,iy:ir.y,wpl,lpl,cs,ss,maskRT,lid,cl,B,E,EB,cx,hw,MM:new PIXI.Matrix().translate(-EB.x,-EB.y)};
}
// lid deformation shared by white and lashes. k = open (0..1.2), sm = eye smile (lower lid rises, crescent),
